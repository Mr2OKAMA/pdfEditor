<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PDF ビューア＆エディタ</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="toolbar">
  <div class="group">
    <button id="btn-open">開く</button>
    <button id="btn-save" disabled>保存</button>
    <input type="file" id="file-open" accept="application/pdf" multiple hidden>
  </div>
  <div class="group" id="tools">
    <button data-tool="select" class="active" title="選択/移動 (Deleteで削除)">選択</button>
    <button data-tool="highlight">ハイライト</button>
    <button data-tool="draw">手書き</button>
    <button data-tool="rect">四角</button>
    <button data-tool="text">テキスト</button>
    <button data-tool="image">画像/署名</button>
    <button id="btn-stamp" title="日付印（電子印）">電子印</button>
    <input type="color" id="color" value="#ffeb3b" title="色">
    <label>太さ<input type="number" id="width" value="2" min="1" max="20"></label>
    <label>文字<input type="number" id="fontsize" value="16" min="6" max="120"></label>
    <button id="btn-undo" title="Ctrl+Z">元に戻す</button>
  </div>
  <div class="group">
    <button id="btn-zoom-out">－</button>
    <span id="zoom-label">100%</span>
    <button id="btn-zoom-in">＋</button>
    <span id="page-label">- / -</span>
  </div>
  <div class="group" id="page-ops">
    <button data-op="rotate-l">⟲ 回転</button>
    <button data-op="rotate-r">⟳ 回転</button>
    <button data-op="delete">ページ削除</button>
    <button data-op="up">↑ 移動</button>
    <button data-op="down">↓ 移動</button>
    <button data-op="blank">白紙挿入</button>
    <button data-op="merge">結合</button>
    <button id="btn-insert" disabled title="他のタブのPDFからページを挿入">他PDFから挿入</button>
    <button data-op="extract">抽出</button>
    <button data-op="watermark">透かし</button>
    <button data-op="numbers">ページ番号</button>
    <input type="file" id="file-merge" accept="application/pdf" hidden>
    <input type="file" id="file-image" accept="image/png,image/jpeg" hidden>
  </div>
</header>
<nav id="tabs" hidden></nav>
<dialog id="ins-dialog">
  <h3>他のPDFからページを挿入</h3>
  <label>元のPDF <select id="ins-src"></select></label>
  <label>ページ <input type="text" id="ins-range" placeholder="例: 1-3,5"></label>
  <div id="ins-info"></div>
  <label>挿入位置
    <select id="ins-where">
      <option value="after">現在のページの後</option>
      <option value="before">現在のページの前</option>
      <option value="end">末尾</option>
    </select>
  </label>
  <div class="actions"><button id="ins-cancel">キャンセル</button><button id="ins-ok" class="active">挿入</button></div>
</dialog>
<dialog id="stamp-dialog">
  <h3>電子印（日付印）</h3>
  <label>苗字（上段） <input type="text" id="stamp-top" maxlength="4"></label>
  <label>日付（中段） <input type="date" id="stamp-date"></label>
  <label>日付形式
    <select id="stamp-fmt">
      <option value="dot">2026.11.13</option>
      <option value="slash">2026/11/13</option>
      <option value="kanji">2026年11月13日</option>
      <option value="short">26.11.13</option>
      <option value="wdot">R8.11.13</option>
      <option value="wkanji">令和8年11月13日</option>
    </select>
  </label>
  <label>名前（下段） <input type="text" id="stamp-bottom" maxlength="4"></label>
  <label>色 <input type="color" id="stamp-color" value="#d32f2f"></label>
  <div style="text-align:center"><canvas id="stamp-preview" width="120" height="120" style="width:120px;height:120px"></canvas></div>
  <div class="actions"><button id="stamp-cancel">キャンセル</button><button id="stamp-ok" class="active">配置</button></div>
</dialog>
<main id="viewer">
  <div id="drop">PDFファイルをここにドラッグ＆ドロップ、または「開く」を押してください</div>
</main>
<div id="status"></div>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
